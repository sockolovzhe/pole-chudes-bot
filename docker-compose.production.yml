services:
  mongodb:
    image: mongo:7.0
    container_name: pole-chudes-mongodb-prod
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ADMIN}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: pole-chudes-bot
    volumes:
      - mongodb_data_prod:/data/db
      - mongodb_config_prod:/data/configdb
    networks:
      - pole-chudes-network-prod
    command: ["--bind_ip_all", "--auth"]
    
  bot:
    build: .
    container_name: pole-chudes-bot-prod
    restart: unless-stopped
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      MONGO_ADMIN: ${MONGO_ADMIN}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
      MONGO_ENV: ${MONGO_ENV}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - pole-chudes-network-prod

volumes:
  mongodb_data_prod:
  mongodb_config_prod:

networks:
  pole-chudes-network-prod:
    driver: bridge